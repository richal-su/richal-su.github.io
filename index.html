<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Поиск музыки...">
        </div>
    </header>

    <nav class="tabs">
        <div class="tab-item active" data-tab="all">Для вас</div>
        <div class="tab-item" data-tab="favorites">
            Избранное <i class="fa-solid fa-heart" style="font-size: 10px; margin-left: 4px;"></i>
        </div>
    </nav>

    <main id="trackList" class="content-area">
        <div class="loader-placeholder">Загрузка библиотеки...</div>
    </main>

    <footer class="player-widget">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="player-body">
            <div class="current-info" id="currentTrackInfo">
                <img src="https://placehold.co/100x100/2c2c2e/white?text=..." alt="Cover" id="playerCover" class="mini-cover">
                <div class="text-meta">
                    <div id="playerTitle" class="title">Не выбрано</div>
                    <div id="playerArtist" class="artist">Нажмите на трек</div>
                </div>
            </div>

            <div class="player-controls">
                <button id="prevBtn" class="btn-icon">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="playPauseBtn" class="btn-icon play-main">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="nextBtn" class="btn-icon">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
